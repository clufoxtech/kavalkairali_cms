
<div class="flex flex-col flex-auto w-full">

    <div class="flex flex-wrap w-full max-w-screen-xl mx-auto p-6 md:p-8">
   <div class="grid grid-cols-1 xl:grid-cols-3 gap-8 w-full ">
        <!-- Recent transactions table -->
        <div class="xl:col-span-2 flex flex-col flex-auto bg-card shadow rounded-2xl overflow-hidden">
            <div class="p-6">
                <div class="mr-4 text-lg font-medium tracking-tight leading-6 truncate">Orders</div>
                <div class="text-secondary font-medium">Data showing present day order</div>
            </div>
            <div class="overflow-x-auto mx-6">
                <p-table  [value]="dailyList" >
                    <ng-template pTemplate="header" let-columns>
                        <tr>
                            <th>SL NO.</th>
                            <th>BOOK TYPE</th>
                            <th>COMPLETED ORDERS</th>
                            <th>TOTAL BOOKS </th>
                            <th>REVENUE</th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-product let-columns="columns" let-rowIndex="rowIndex">
                        <tr>
                            <td >{{rowIndex+1}}</td>
                            <td >{{product.type}}</td>
                            <td>{{product.orders}}</td>
                            <td>{{product.books}}</td>
                            <td>{{product.totalAmount}}</td>
                        </tr>
                      
                    </ng-template>
                </p-table>
                        
                  
            </div>
        </div>
       
       
    </div>
    <div class="grid grid-cols-3 xl:grid-cols-3 gap-8 w-full mt-8">
        <div class="sm:col-span-1 md:col-span-2 lg:col-span-1 flex flex-col flex-auto p-6 bg-card shadow rounded-2xl overflow-hidden">
           
            <p-chart type="bar" [data]="data1" [options]="options"></p-chart>
        </div>
    
        <div class="sm:col-span-1 md:col-span-2 lg:col-span-1 flex flex-col flex-auto p-6 bg-card shadow rounded-2xl overflow-hidden">
            <p-chart type="bar" [data]="data2" [options]="options"></p-chart>
        </div>
        <div class="sm:col-span-1 md:col-span-2 lg:col-span-1 flex flex-col flex-auto p-6 bg-card shadow rounded-2xl overflow-hidden">
            <p-chart type="bar" [data]="data3" [options]="options"></p-chart>
        </div>
        
     </div>
     <div class="sm:col-span-1 md:col-span-2 lg:col-span-1 flex flex-col flex-auto p-6 bg-card shadow rounded-2xl overflow-hidden mt-3">
        <p-chart type="bar" [data]="data4" [options]="options1"></p-chart>
    </div>
    </div>
    
    </div>
