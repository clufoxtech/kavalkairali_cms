<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent shadow content">

  
    <div class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-2 px-2 md:px-2 border-b">
        <div class="col-sm-3 col-xs-3 col-md-2.2 pl-3">
            <div class="text-xl font-bold tracking-tight fontcls">Blocked Reason</div>
        </div>
        
        <div class="flex sm:ml-2 sm:flex-row flex-0  shrink-0 items-center mt-6 sm:mt-0 pr-1">
            <button 
                mat-stroked-button style="background-color:#8ed93b;color:white" (click)="AddReason()"
           >
            <span class="ml-1 mr-1 btn-sm fontcls">Add Reason</span>
            </button>
           
        </div>
    </div>
    
    <!-- Main -->
    
        <div class="card">
            <p-table styleClass="p-datatable-sm" [autoLayout]="true" #dt1 responsiveLayout="scroll" 
            [value]="blockreason" [paginator]="true" [rows]="10" 
            [rowsPerPageOptions]="[10,25,50]" totalRecords="totalRecords" 
            [resizableColumns]="true"  [scrollable]="true"  scrollHeight="380px" sortMode="multiple">
               
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th style="max-width:45px">No</th>
                        <th >Reason</th>
                        <th style="max-width:45px"></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-product let-columns="columns" let-rowIndex="rowIndex">
                    <tr>
                        <td style="max-width:45px">{{rowIndex+1}}</td>
                        <td title={{product.name}} >{{product.name}}</td>
                       
                        <td style="justify-content: center;cursor:pointer;max-width:45px;"><i class="pi pi-ellipsis-v" (click)="show($event,product)"></i></td>
                    </tr>
                </ng-template>
            </p-table>
        </div>

        <p-overlayPanel #op>
            <ng-template pTemplate>
                <ul> 
                    <li (click)="EditReason(product)" style="cursor:pointer">Edit</li>
                    <HR SIZE="1">
                    <li (click)="Delete(product)" style="cursor:pointer">Delete</li>
                </ul>
            </ng-template>
        </p-overlayPanel>
   <!--Add new Department-->
<p-dialog [(visible)]="display" header="Add Reason" [breakpoints]="{'960px': '55vw', '640px': '95vw'}"  [modal]="true" [style]="{width: '40vw'}" [baseZIndex]="10000"
[draggable]="false" [resizable]="false">


  <form [formGroup]="AddForm" (ngSubmit)="addBlockedReason()" >
    <div class="container">
    <div class="row">
      <div class="col-100">
        <label for="reason">Reason</label>
      </div>
      <div class="col-100">
        <textarea id="reason" name="reason" formControlName="reason" placeholder="Your reason.." rows="5"></textarea>
      </div>
    </div> 
    <div class="row" >
        <div class="col-100 text-right">
            <button type="button" class="cancelbtn btn-outline-secondary btn btn-sm" (click)="Cancel()">CANCEL</button>
            <button type="submit" class="submitbtn btn-outline-secondary btn btn-sm">SAVE</button>
        </div>
    </div>
  </div>
  </form>

</p-dialog>    
         
<p-confirmDialog  [breakpoints]="{'960px': '50vw', '640px': '80vw'}" [style]="{width: '30vw'}">
</p-confirmDialog>   

   
</div>
 
<p-dialog [(visible)]="showEdit" header="Edit Reason" [breakpoints]="{'960px': '55vw', '640px': '95vw'}"  [modal]="true" [style]="{width: '40vw'}" [baseZIndex]="10000"
[draggable]="false" [resizable]="false">


  <form [formGroup]="EditForm" (ngSubmit)="EditedReason()" >
    <div class="container">
    <div class="row">
      <div class="col-100">
        <label for="reason">Reason</label>
      </div>
      <div class="col-100">
        <input type="text" id="reason" name="reason" formControlName="editreason" placeholder="Your reason.." [(ngModel)]="product.name" >
      </div>
    </div> 
    <div class="row" >
        <div class="col-100 text-right fontcls">
            <button type="button" class="cancelbtn btn-outline-secondary btn btn-sm" (click)="CancelEdit()">CANCEL</button>
            <button type="submit" class="submitbtn btn-outline-secondary btn btn-sm">SAVE</button>
        </div>
    </div>
  </div>
  </form>

</p-dialog>   
<p-toast position="bottom-right"></p-toast>
