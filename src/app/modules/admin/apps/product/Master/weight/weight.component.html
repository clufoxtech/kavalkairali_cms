
<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent shadow content">

  
    <div class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-2 px-2 md:px-2 border-b">
        <div class="col-sm-3 col-xs-4 col-md-4 pl-3">
            <div class="text-xl font-bold tracking-tight fontcls">Weight</div>
        </div>
        <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4 pr-3">
            <!-- Search -->
            <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded md:min-w-64 xs:min-w-64">
                <mat-icon
                class="icon-size-5"
                matPrefix
                [svgIcon]="'heroicons_solid:search'"></mat-icon>
            <input
                matInput
                [formControl]="searchInputControl"
                [autocomplete]="'off'"
                [placeholder]="'Search'" (input)="dt1.filterGlobal($event.target.value, 'contains')">
                <!-- <button pButton label="Clear" class="p-button-outlined" icon="pi pi-filter-slash" (click)="clear(dt1)"></button> -->
        </mat-form-field>
            <!-- Add product button -->
            <button style="background-color:#8ed93b;color:white"
                class="ml-4 " 
                mat-stroked-button 
            (click)="newWeight()">
            <mat-icon [svgIcon]="'heroicons_outline:plus'" style="color:white"></mat-icon>
            <span class="ml-1 mr-1">Add Weight</span>
            </button>
        </div>
       
    </div>
    <!-- Main -->
    
        <div class="card ml-4">
            <p-table styleClass="p-datatable-sm" #dt1 responsiveLayout="scroll" [value]="weight" [globalFilterFields]="['warehouse']" [paginator]="true" [rows]="9" [rowsPerPageOptions]="[10,25,50]" [resizableColumns]="true"  [scrollable]="true"  scrollHeight="400px" sortMode="multiple">
               
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th style="max-width:45px;min-width:30px;">NO</th>
                        <th  style="min-width:100px">Weight range(in grams)</th>
                        <th style="max-width:45px;"></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-product let-columns="columns" let-rowIndex="rowIndex">
                    <tr>
                        <td style="max-width:45px;min-width:30px;">{{rowIndex+1}}</td>
                        <td  style="min-width:100px">{{product.startWeight}} - {{product.endWeight}}</td>
                        <td style="justify-content: center;cursor:pointer;max-width:45px;"><i class="pi pi-ellipsis-v" (click)="show($event,product)"></i></td>
                    </tr>
                </ng-template>
            </p-table>
            <p-overlayPanel #op>
                <ng-template pTemplate>
                    <ul>
                        <li (click)="edit(product)" style="cursor:pointer;">Edit</li>
                        <HR SIZE="1">
                        <li (click)="Delete(product)" style="cursor:pointer;">Delete</li>
                    </ul>
                </ng-template>
            </p-overlayPanel>
</div>
<p-dialog [(visible)]="display" header="Add Weight(in grams)" [breakpoints]="{'960px': '55vw', '640px': '95vw'}"  [modal]="true" [style]="{width: '40vw'}" [baseZIndex]="10000"
[draggable]="false" [resizable]="false">


  <form [formGroup]="addForm" (ngSubmit)="addweight()"  novalidate>
    <div class="container">
    <div class="row">
      <div class="col-25">
        <label for="addStartWeight">From</label>
      </div>
      <div class="col-75">
        <input type="number" id="addStartWeight" style="border-width:1px" formControlName="addStartWeight" placeholder="Type here.." step="0.01">
        <div *ngIf="getControl['addStartWeight'].touched && getControl['addStartWeight'].invalid" class="text-danger">
            <div *ngIf="getControl['addStartWeight'].errors?.['required']">From Weight is required.</div>
          </div>
      </div>
    </div>
    <div class="row">
        <div class="col-25">
          <label for="addEndWeight">To</label>
        </div>
        <div class="col-75">
          <input type="number" id="addEndWeight" style="border-width:1px" formControlName="addEndWeight" placeholder="Type here.." step="0.01">
          <div *ngIf="getControl['addEndWeight'].touched && getControl['addEndWeight'].invalid" class="text-danger">
              <div *ngIf="getControl['addEndWeight'].errors?.['required']">To Weight is required.</div>
            </div>
        </div>
      </div>
      <div class="row" *ngIf="isNotValid">
        <div class="col-75" style="color: red;">
          <label for="errorMsg">start weight is greater than end weight</label>
        </div>
      </div>
    <div class="row" >
        <div class="col-100 text-right fontcls">
            <button type="button" class="cancelbtn btn-outline-secondary btn btn-sm" (click)="cancel()">CANCEL</button>
            <button type="submit" class="submitbtn btn-outline-secondary btn btn-sm" >SUBMIT</button>
        </div>
    </div>
  </div>
  </form>

</p-dialog>
<p-dialog [(visible)]="editdisplay" header="Edit Weight" [breakpoints]="{'960px': '55vw', '640px': '95vw'}"  [modal]="true" [style]="{width: '40vw'}" [baseZIndex]="10000"
[draggable]="false" [resizable]="false">


  <form [formGroup]="editForm" (ngSubmit)="editWeight()"  novalidate>
    <div class="container">
    <div class="row">
      <div class="col-25">
        <label for="editStartWeight">From</label>
      </div>
      <div class="col-75">
        <input type="number" id="editStartWeight" style="border-width:1px" formControlName="editStartWeight" placeholder="Type here.." [(ngModel)]="product.startWeight">
        <div *ngIf="getEditControl['editStartWeight'].touched && getEditControl['editStartWeight'].invalid" class="text-danger">
            <div *ngIf="getEditControl['editStartWeight'].errors?.['required']">From Weight is required.</div>
          </div>
      </div>
    </div>
    <div class="row">
        <div class="col-25">
          <label for="editEndWeight">To</label>
        </div>
        <div class="col-75">
          <input type="number" id="editEndWeight" style="border-width:1px" formControlName="editEndWeight" placeholder="Type here.." [(ngModel)]="product.endWeight">
          <div *ngIf="getEditControl['editEndWeight'].touched && getEditControl['editEndWeight'].invalid" class="text-danger">
              <div *ngIf="getEditControl['editEndWeight'].errors?.['required']">To Weight is required.</div>
            </div>
        </div>
      </div>
      
    <div class="row" >
        <div class="col-100 text-right fontcls">
            <button type="button" class="cancelbtn btn-outline-secondary btn btn-sm" (click)="editCancel()">CANCEL</button>
            <button type="submit" class="submitbtn btn-outline-secondary btn btn-sm" >SUBMIT</button>
        </div>
    </div>
  </div>
  </form>

</p-dialog>
<p-confirmDialog  [breakpoints]="{'960px': '50vw', '640px': '80vw'}" [style]="{width: '30vw'}">
</p-confirmDialog>
<p-toast position="bottom-right"></p-toast>
